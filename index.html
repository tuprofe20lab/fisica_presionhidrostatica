const DATA=[{"title": "Presión de un cubo", "type": "box", "q": "Un cubo de <b data-key=\"mass\">10 kg</b> tiene una <b data-key=\"area\">arista de 5 m</b>. Calcula la presión que ejerce sobre la mesa. <b data-key=\"force\">g = 10 m/s²</b>.", "vals": [10, 5], "steps": [{"title": "Identifica el contacto", "formula": "A = lado × lado", "text": "La presión depende del área de la cara que toca la mesa, no del área total del cubo.", "focus": "area"}, {"title": "Calcula el área", "formula": "A = 5 × 5 = 25 m²", "text": "Iluminamos únicamente la base de apoyo.", "focus": "area"}, {"title": "Calcula el peso", "formula": "F = mg = 10 × 10 = 100 N", "text": "En reposo, la fuerza que el cubo ejerce sobre la mesa tiene el módulo de su peso.", "focus": "force"}, {"title": "Divide fuerza entre área", "formula": "P = <frac>100|25</frac> = 4 Pa", "text": "Cada metro cuadrado soporta 4 newtons.", "focus": "result"}], "answer": "4 Pa", "check": "¿Qué área usamos?", "options": ["Las seis caras", "Solo la base", "Solo la cara superior"], "correct": 1, "note": "", "num": 1}, {"title": "De pascales a kilopascales", "type": "box", "q": "Una caja de <b data-key=\"mass\">2 kg</b> tiene dimensiones <b data-key=\"area\">5 m × 5 m × 5 m</b>. Calcula su presión sobre la mesa en kPa. g = 10 m/s².", "vals": [2, 5], "steps": [{"title": "Base de apoyo", "formula": "A = 5 × 5 = 25 m²", "text": "Conservamos las unidades del dibujo original: metros.", "focus": "area"}, {"title": "Peso de la caja", "formula": "F = 2 × 10 = 20 N", "text": "La masa se expresa en kg; el peso es una fuerza en N.", "focus": "force"}, {"title": "Presión en pascales", "formula": "P = <frac>20|25</frac> = 0,8 Pa", "text": "Una gran base distribuye el peso y produce una presión pequeña.", "focus": "result"}, {"title": "Conversión solicitada", "formula": "P = <frac>0,8|1000</frac> = 0,0008 kPa", "text": "Como 1 kPa equivale a 1000 Pa, dividimos entre 1000.", "focus": "result"}], "answer": "0,0008 kPa", "check": "Para pasar de Pa a kPa…", "options": ["Multiplico por 1000", "Divido entre 1000", "Divido entre 10"], "correct": 1, "note": "", "num": 2}, {"title": "Presión hidrostática y absoluta", "type": "water", "q": "Un recipiente abierto contiene <b data-key=\"depth\">2 m de agua</b>. Calcula la presión hidrostática en Pa y la absoluta en kPa. <b data-key=\"rho\">ρ = 1000 kg/m³</b>, g = 10 m/s²; <b data-key=\"atm\">Pₐₜₘ = 100 000 Pa</b>.", "vals": [1000, 2], "steps": [{"title": "Mide desde la superficie", "formula": "h = 2 m", "text": "La profundidad se mide verticalmente desde la superficie libre hasta el fondo.", "focus": "depth"}, {"title": "Aporte del agua", "formula": "Pₕ = ρgh = 1000 × 10 × 2", "text": "La presión hidrostática solo cuenta el aporte del líquido.", "focus": "rho"}, {"title": "Resultado hidrostático", "formula": "Pₕ = 20 000 Pa", "text": "Equivale a 20 kPa por encima de la presión atmosférica.", "focus": "result"}, {"title": "Añade la atmósfera", "formula": "Pₐᵦₛ = 100 000 + 20 000 = 120 000 Pa", "text": "El aire también presiona sobre la superficie del agua.", "focus": "atm"}, {"title": "Expresa en kPa", "formula": "Pₐᵦₛ = 120 kPa", "text": "No confundas 20 kPa de presión hidrostática con 120 kPa de presión absoluta.", "focus": "result"}], "answer": "20 000 Pa; 120 kPa", "check": "La presión absoluta incluye…", "options": ["Solo agua", "Agua y atmósfera", "Solo atmósfera"], "correct": 1, "note": "", "num": 3}, {"title": "Prensa hidráulica en equilibrio", "type": "press", "q": "En una prensa, <b data-key=\"area\">A₁ = 80 cm² y A₂ = 400 cm²</b>. Sobre el émbolo mayor hay un <b data-key=\"force\">peso de 700 N</b>. Halla F₁ para mantener el equilibrio.", "vals": [80, 400, 140, 700], "steps": [{"title": "Equilibrio del émbolo mayor", "formula": "F₂ = W = 700 N", "text": "La fuerza ascendente del fluido equilibra el peso. Modelo ideal, sin rozamiento y con émbolos a igual nivel.", "focus": "force"}, {"title": "Aplica Pascal", "formula": "<frac>F₁|A₁</frac> = <frac>F₂|A₂</fra function render(){const d=DATA[index],s=d.steps[step],last=step===d.steps.length-1;if(last)completed.add(index);app.innerHTML=`<div class="toolbar"><select aria-label="Seleccionar ejercicio" onchange="openEx(+this.value)">${DATA.map((x,i)=>`<option value="${i}" ${index===i?'selected':''}>${x.num}. ${x.title}</option>`).join('')}</select><span class="pill">Ejercicio ${d.num} / 15</span></div><section class="statement"><div style="color:#8de7ff" class="eyebrow">${d.title}</div><p>${d.q}</p></section><div class="layout" data-focus="${s.focus}"><section class="panel"><div class="sync-title"><span>Esquema en acción</span><span class="sync-tag">Paso ${step+1} · sincronizado</span></div><div class="figure" id="figure">${diagram(d,s.focus)}</div><p class="caption" id="caption">${caption(d,s.focus)}</p>${visualChips(d)}${explorer(d)}${d.note?`<div class="note">${d.note}</div>`:''}</section><section class="panel"><div class="sync-title" style="margin-bottom:16px"><span>Desarrollo matemático</span><span class="sync-tag">Mira el mismo color a la izquierda</span></div><div class="steps">${d.steps.map((x,j)=>`<button title="Paso ${j+1}: ${x.title}" aria-label="Ir al paso ${j+1}" class="${j<=step?'on':''} ${j===step?'current':''}" onclick="stop();setStep(${j})"></button>`).join('')}</div><div class="stepbox" aria-live="polite"><div class="eyebrow">Paso ${step+1} de ${d.steps.length}</div><h2>${s.title}</h2><div class="formula">${math(s.formula)}</div><div class="guide"><div class="robot ${last?'done':''}" aria-hidden="true"><div class="head"><div class="face"><i class="eye"></i><i class="eye"></i></div></div><div class="body"></div></div><p>${s.text}</p></div>${last?`<p class="result">✓ Respuesta: ${d.answer}</p><div class="quiz"><strong>Comprueba tu comprensión</strong><p>${d.check}</p>${d.options.map((o,k)=>`<button onclick="check(${k},this)">${o}</button>`).join('')}<div class="feedback" id="feedback" aria-live="polite"></div></div>`:''}</div><div class="bottom"><button onclick="move(-1)" ${step===0?'disabled':''}>← Anterior</button><button id="play" onclick="auto()">${timer?'Ⅱ Pausar':'▶ Auto'}</button><button class="primary" onclick="move(1)" ${last?'disabled':''}>Siguiente paso →</button></div><details class="history"><summary>Ver pasos desarrollados (${step+1})</summary><ol>${d.steps.slice(0,step+1).map(x=>`<li><strong>${x.title}</strong><div class="formula">${math(x.formula)}</div></li>`).join('')}</ol></details></section></div><div class="bottom"><button onclick="openEx(${index-1})" ${index===0?'disabled':''}>← Ejercicio anterior</button><button onclick="stop();setStep(0)">↻ Reiniciar pasos</button><button onclick="${index===14?'home()':`openEx(${index+1})`}">${index===14?'Volver al menú':'Ejercicio siguiente →'}</button></div>`;app.querySelectorAll('[data-key]').forEach(el=>el.classList.toggle('active',el.dataset.key===s.focus));}

function oldCaption(d,f){return ({box:'La base resaltada recibe el peso del cuerpo.',water:'La profundidad vertical determina el aporte del agua.',diff:'La ruta amarilla conecta los niveles de A y B.',layers:'Amarillo: líquido superior. Azul: líquido inferior. La ruta muestra el tramo considerado.',press:'La fuerza se transmite a través del líquido. Los émbolos se representan esquemáticamente.',density:'Modelo de una boya homogénea; relacionamos su masa con el volumen.',glass:'Cada flecha representa una parte de la fuerza que el aire ejerce perpendicularmente.',air:'La ruta por el agua llega al mismo nivel que la interfaz con el aire encerrado.'})[d.type]}
function explorer(d){if(!['water','diff','layers','press'].includes(d.type))return '';return `<div class="explore"><label for="range"><b>Explora aparte:</b> ${d.type==='press'?'cambia la fuerza aplicada':'cambia la escala de profundidades'}. Los datos del ejercicio permanecen fijos.</label><input id="range" type="range" min="25" max="200" value="100" step="5" oninput="explore(this.value)"><div class="meter"><div id="bar" style="width:50%"></div></div><output id="expout">Mueve el control para comparar con el caso original.</output></div>`}
function explore(n){const d=DATA[index],v=d.vals,k=n/100;let out='';if(d.type==='press'){const f1=v[2]*k,f2=v[3]*k;out=`F₁ = ${fmt(f1)} N → F₂ = ${fmt(f2)} N`+(d.num===15?` · a = ${fmt((f2-100)/10)} m/s² (positivo: arriba)`:' · Con 700 N de carga, solo F₁ = 140 N mantiene el equilibrio.')}else{let p=d.type==='layers'?(v[0]*v[2]+v[1]*v[3])*10:v[0]*10*v[1];out=`Profundidades × ${fmt(k)} → ${d.type==='diff'?'ΔP':'Pₕ'} = ${fmt(p*k)} Pa`;}document.getElementById('expout').textContent=out;document.getElementById('bar').style.width=(n/2)+'%';}

}
